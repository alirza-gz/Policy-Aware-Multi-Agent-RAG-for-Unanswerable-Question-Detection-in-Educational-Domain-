REASONING_MODE: ollama
OLLAMA_URL: http://localhost:11434/api/generate
OLLAMA_MODEL: qwen2.5:3b-instruct
EMBED_MODEL: all-MiniLM-L6-v2
EMBED_DIM: 384
CONFIDENCE_THRESHOLD: 0.5
AUTO_BUILD_FAISS: true
CORPUS_DIR: data/corpus
GOVERNANCE_ENABLED: true
GOVERNANCE:
  answerability_enabled: true
  retriever_abstain_below: 0.2
  reasoner_abstain_below: 0.3
  clarify_band: [0.3, 0.5]
# Additive retrieval stack for the thesis FULL system.
RETRIEVAL:
  mode: hybrid          # hybrid | dense | bm25 | none
  rrf_k: 60
  candidate_k: 20
RERANKER:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_k: 5
THRESHOLDS:
  retriever: 0.2
  reasoner: 0.3
BANNED_PHRASES:
- i diagnose you
- you have been diagnosed
- i prescribe
- you should take
- recommended dosage is
- top secret classified
- classified government information
- reveal confidential
- share confidential
PII_FILTERS:
  date: true
  email: true
  id: true
  ip: true
  # Person-name redaction is disabled for this evaluation domain. The
  # educational corpus (Wikipedia-sourced statistics/ML/probability content)
  # routinely names real historical figures as part of the correct answer
  # itself (e.g. Bayes, Fisher, Laplace, Markov, Poisson, Gauss, Pearson,
  # Davenport & Patil). The regex-based name detector (RE_NAME, a generic
  # "Capitalized Capitalized" heuristic in app/agents/governance_agent.py)
  # cannot distinguish these from genuine PII and was redacting them as
  # "[REDACTED_NAME]", corrupting otherwise-correct answers and depressing
  # answer-quality metrics (groundedness, exact_match) for every governed
  # system relative to ungoverned baselines -- a measurement artifact, not a
  # real governance trade-off. The PII-redaction capability itself still
  # works correctly (verified against synthetic real-name examples such as
  # "John Smith"); it is switched off here only because this corpus has
  # effectively no real PII risk. Re-enable for any deployment where user-
  # or student-submitted text (which can contain genuine personal names) is
  # processed, ideally after replacing RE_NAME with a proper NER model.
  name: false
  phone: true