# Reproducible experiment configuration for the thesis evaluation (Option B).
# Copied to results/experiments_config_used.yml on every run.

questions: data/eval/educational_v2_questions.jsonl

# Retrieval depth after fusion/rerank (same for every retrieving system).
top_k: 5

# RAG + Threshold baseline: abstain if max retrieval score < tau.
# Independent of GovernanceAgent; documented for fairness.
rag_threshold: 0.2

# Reasoning runtime: "mock" (deterministic) or "ollama".
reasoning_mode: ollama

# Repeated runs for mean / std / significance.
seeds: [42, 123, 2024]

# Cap on questions per run (0 = all). Use 100 for smoke tests.
limit: 0

# Governance overrides applied to all governed systems (empty = config.yml).
governance: {}

# Optional subset; default = all baselines + ablations in eval.baselines.
# systems: null

out_dir: results
predictions_file: predictions_all.jsonl
